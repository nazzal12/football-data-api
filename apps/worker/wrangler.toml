name = "football-api"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]
account_id = "172e60bf5969fa2ef5e34f840c3b1045"

[observability]
enabled = true

[vars]
ENVIRONMENT = "production"
# Soft client gate (Dart app + verfutbollibre.net). Set ACCESS_GUARD=off in .dev.vars to disable locally.

# Date lists every 5 minutes (matches 5m soft TTL). Catalog every 5 hours.
# Live matches are NEVER cron-refreshed — user request + 5s lifecycle only.
[triggers]
crons = ["*/5 * * * *", "0 */5 * * *"]

# Workers KV — metadata, lifecycle, id maps, leases
[[kv_namespaces]]
binding = "META"
id = "47d3dcca27284017a3d6a1be1d2cb119"
preview_id = "47d3dcca27284017a3d6a1be1d2cb119"

# R2 — canonical objects (bucket: football-api-objects)
# S3 API (for non-Worker clients): https://172e60bf5969fa2ef5e34f840c3b1045.r2.cloudflarestorage.com/football-api-objects
[[r2_buckets]]
binding = "OBJECTS"
bucket_name = "football-api-objects"
preview_bucket_name = "football-api-objects"

# Set locally in .dev.vars (gitignored) or as a Worker secret in production:
# API_SPORTS_KEY

name = "football-api"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"

[[kv_namespaces]]
binding = "META"
id = "00000000000000000000000000000000"
preview_id = "00000000000000000000000000000000"

[[r2_buckets]]
binding = "OBJECTS"
bucket_name = "football-api-objects"
preview_bucket_name = "football-api-objects-preview"

# Set locally in .dev.vars (gitignored) or as a Worker secret in production:
# API_SPORTS_KEY
